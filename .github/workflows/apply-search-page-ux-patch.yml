name: Apply Search Page UX Patch

on:
  push:
    branches:
      - enhance/search-location-ux
    paths:
      - scripts/apply-search-page-ux-patch.mjs
      - .github/workflows/apply-search-page-ux-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: enhance/search-location-ux
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply targeted patch
        run: node scripts/apply-search-page-ux-patch.mjs
      - name: Remove temporary patch helper
        run: |
          rm scripts/apply-search-page-ux-patch.mjs
          rm .github/workflows/apply-search-page-ux-patch.yml
      - name: Commit patched page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Search.tsx scripts/apply-search-page-ux-patch.mjs .github/workflows/apply-search-page-ux-patch.yml
          git commit -m "Enhance search location UX and clear filters"
          git push origin HEAD:enhance/search-location-ux
