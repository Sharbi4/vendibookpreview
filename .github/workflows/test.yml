name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  vitest:
    name: Vitest (availability + picker)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run critical availability tests (blocking)
        run: |
          bunx vitest run \
            src/lib/__tests__/availabilityConflict.test.ts \
            src/components/listing/__tests__/RentalAvailabilityPicker.test.tsx \
            --reporter=verbose

      - name: Run full test suite
        run: bunx vitest run --reporter=verbose
