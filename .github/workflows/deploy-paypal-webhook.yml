name: Deploy PayPal payments

on:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/paypal-webhook/**"
      - "supabase/functions/paypal-subscription-create/**"
      - "supabase/functions/_shared/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-paypal-webhook.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-paypal-payments-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Configure and deploy PayPal functions
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: nbrehbwfsmedbelzntqs
      # PayPal webhook IDs are identifiers, not API credentials. Keep the
      # supplied production ID here so deployment is not blocked by a second
      # GitHub secret that may not exist yet.
      PAYPAL_WEBHOOK_ID: 6XK510927N3848536
      PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID }}
      PAYPAL_CLIENT_SECRET: ${{ secrets.PAYPAL_CLIENT_SECRET }}
      PAYPAL_ENVIRONMENT: ${{ secrets.PAYPAL_ENVIRONMENT }}

    steps:
      - name: Check required deployment credential
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${SUPABASE_ACCESS_TOKEN:-}" ]]; then
            echo "Missing GitHub Actions secret: SUPABASE_ACCESS_TOKEN" >&2
            echo "Add a Supabase personal access token with access to project ${SUPABASE_PROJECT_ID}." >&2
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Install Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: latest

      - name: Configure PayPal runtime secrets
        shell: bash
        run: |
          set -euo pipefail

          # Always synchronize the registered webhook ID supplied for this
          # project. Never print secret values.
          supabase secrets set \
            --project-ref "$SUPABASE_PROJECT_ID" \
            PAYPAL_WEBHOOK_ID="$PAYPAL_WEBHOOK_ID"

          # Synchronize API credentials when repository secrets exist. If they
          # are absent, deployment still proceeds so an existing Supabase secret
          # is not accidentally overwritten or blocked.
          if [[ -n "${PAYPAL_CLIENT_ID:-}" && -n "${PAYPAL_CLIENT_SECRET:-}" ]]; then
            paypal_env="${PAYPAL_ENVIRONMENT:-live}"
            supabase secrets set \
              --project-ref "$SUPABASE_PROJECT_ID" \
              PAYPAL_CLIENT_ID="$PAYPAL_CLIENT_ID" \
              PAYPAL_CLIENT_SECRET="$PAYPAL_CLIENT_SECRET" \
              PAYPAL_ENVIRONMENT="$paypal_env"
            echo "PayPal API credential names were synchronized to Supabase."
          else
            [[ -n "${PAYPAL_CLIENT_ID:-}" ]] || echo "GitHub secret PAYPAL_CLIENT_ID is not configured; preserving any existing Supabase value."
            [[ -n "${PAYPAL_CLIENT_SECRET:-}" ]] || echo "GitHub secret PAYPAL_CLIENT_SECRET is not configured; preserving any existing Supabase value."
          fi

      - name: Deploy PayPal webhook Edge Function
        shell: bash
        run: |
          set -euo pipefail
          supabase functions deploy paypal-webhook \
            --project-ref "$SUPABASE_PROJECT_ID"

      - name: Deploy PayPal subscription Edge Function
        shell: bash
        run: |
          set -euo pipefail
          supabase functions deploy paypal-subscription-create \
            --project-ref "$SUPABASE_PROJECT_ID"

      - name: Verify public webhook endpoint is reachable
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://${SUPABASE_PROJECT_ID}.supabase.co/functions/v1/paypal-webhook"
          status=$(curl --silent --show-error \
            --output /tmp/paypal-webhook-response.txt \
            --write-out "%{http_code}" \
            --request POST "$endpoint" \
            --header "Content-Type: application/json" \
            --data '{}')

          cat /tmp/paypal-webhook-response.txt

          if [[ "$status" != "400" ]]; then
            echo "Expected HTTP 400 from the malformed-payload reachability test; received $status." >&2
            exit 1
          fi

      - name: Verify subscription endpoint is deployed
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://${SUPABASE_PROJECT_ID}.supabase.co/functions/v1/paypal-subscription-create"
          status=$(curl --silent --show-error \
            --output /tmp/paypal-subscription-response.txt \
            --write-out "%{http_code}" \
            --request POST "$endpoint" \
            --header "Content-Type: application/json" \
            --data '{}')

          cat /tmp/paypal-subscription-response.txt

          if [[ "$status" != "401" ]]; then
            echo "Expected HTTP 401 from the unauthenticated subscription smoke test; received $status." >&2
            exit 1
          fi

      - name: Deployment summary
        shell: bash
        run: |
          echo "PayPal webhook and subscription functions deployed to ${SUPABASE_PROJECT_ID}."
          if [[ -z "${PAYPAL_CLIENT_ID:-}" || -z "${PAYPAL_CLIENT_SECRET:-}" ]]; then
            echo "Repository-level PayPal API credentials were not both present. If subscription checkout still reports provider_unavailable, add PAYPAL_CLIENT_ID and PAYPAL_CLIENT_SECRET as GitHub Actions secrets or confirm they already exist in Supabase."
          fi
