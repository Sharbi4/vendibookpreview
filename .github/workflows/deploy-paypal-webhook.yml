name: Deploy PayPal payments

on:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/paypal-webhook/**"
      - "supabase/functions/paypal-subscription-create/**"
      - "supabase/functions/check-stripe-connect/**"
      - "supabase/functions/_shared/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-paypal-webhook.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-paypal-payments-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Configure and deploy PayPal functions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: nbrehbwfsmedbelzntqs
      PAYPAL_WEBHOOK_ID: 6XK510927N3848536
      PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID }}
      PAYPAL_CLIENT_SECRET: ${{ secrets.PAYPAL_CLIENT_SECRET }}
      PAYPAL_ENVIRONMENT: ${{ secrets.PAYPAL_ENVIRONMENT }}
      EXPECTED_SUBSCRIPTION_VERSION: paypal-subscription-create-2026-08-01.3

    steps:
      - name: Check required deployment credential
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${SUPABASE_ACCESS_TOKEN:-}" ]]; then
            echo "Missing GitHub Actions secret: SUPABASE_ACCESS_TOKEN" >&2
            echo "Add a Supabase personal access token with access to project ${SUPABASE_PROJECT_ID}." >&2
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Install Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: latest

      - name: Configure PayPal runtime secrets
        shell: bash
        run: |
          set -euo pipefail

          supabase secrets set \
            --project-ref "$SUPABASE_PROJECT_ID" \
            PAYPAL_WEBHOOK_ID="$PAYPAL_WEBHOOK_ID"

          if [[ -n "${PAYPAL_CLIENT_ID:-}" && -n "${PAYPAL_CLIENT_SECRET:-}" ]]; then
            paypal_env="${PAYPAL_ENVIRONMENT:-live}"
            supabase secrets set \
              --project-ref "$SUPABASE_PROJECT_ID" \
              PAYPAL_CLIENT_ID="$PAYPAL_CLIENT_ID" \
              PAYPAL_CLIENT_SECRET="$PAYPAL_CLIENT_SECRET" \
              PAYPAL_ENVIRONMENT="$paypal_env"
            echo "PayPal API credential names were synchronized to Supabase."
          else
            echo "GitHub PayPal API credential secrets are not both present; preserving existing Supabase values."
          fi

      - name: Deploy PayPal webhook Edge Function
        shell: bash
        run: |
          set -euo pipefail
          supabase functions deploy paypal-webhook \
            --project-ref "$SUPABASE_PROJECT_ID"

      - name: Deploy PayPal subscription Edge Function
        shell: bash
        run: |
          set -euo pipefail
          supabase functions deploy paypal-subscription-create \
            --project-ref "$SUPABASE_PROJECT_ID"

      - name: Deploy legacy Stripe compatibility Edge Function
        shell: bash
        run: |
          set -euo pipefail
          supabase functions deploy check-stripe-connect \
            --project-ref "$SUPABASE_PROJECT_ID"

      - name: Verify public webhook endpoint is reachable
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://${SUPABASE_PROJECT_ID}.supabase.co/functions/v1/paypal-webhook"
          status=$(curl --silent --show-error \
            --output /tmp/paypal-webhook-response.txt \
            --write-out "%{http_code}" \
            --request POST "$endpoint" \
            --header "Content-Type: application/json" \
            --data '{}')

          cat /tmp/paypal-webhook-response.txt
          if [[ "$status" != "400" ]]; then
            echo "Expected HTTP 400 from the malformed-payload reachability test; received $status." >&2
            exit 1
          fi

      - name: Verify corrected subscription build and PayPal credentials
        shell: bash
        run: |
          set -euo pipefail

          anon_key=$(sed -n 's/^VITE_SUPABASE_PUBLISHABLE_KEY="\(.*\)"$/\1/p' .env)
          if [[ -z "$anon_key" ]]; then
            echo "Could not read VITE_SUPABASE_PUBLISHABLE_KEY from .env" >&2
            exit 1
          fi

          endpoint="https://${SUPABASE_PROJECT_ID}.supabase.co/functions/v1/paypal-subscription-create"
          status=$(curl --silent --show-error \
            --output /tmp/paypal-subscription-health.json \
            --write-out "%{http_code}" \
            --request GET "$endpoint" \
            --header "apikey: $anon_key" \
            --header "Authorization: Bearer $anon_key")

          cat /tmp/paypal-subscription-health.json
          if [[ "$status" != "200" ]]; then
            echo "The corrected subscription function is not live; health probe returned HTTP $status." >&2
            exit 1
          fi

          actual_version=$(jq -r '.version // empty' /tmp/paypal-subscription-health.json)
          configured=$(jq -r '.configured // false' /tmp/paypal-subscription-health.json)

          if [[ "$actual_version" != "$EXPECTED_SUBSCRIPTION_VERSION" ]]; then
            echo "Wrong subscription build is live. Expected $EXPECTED_SUBSCRIPTION_VERSION, received ${actual_version:-missing}." >&2
            exit 1
          fi
          if [[ "$configured" != "true" ]]; then
            echo "The function deployed, but PAYPAL_CLIENT_ID and/or PAYPAL_CLIENT_SECRET is missing from Supabase." >&2
            exit 1
          fi

      - name: Verify subscription authorization boundary
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://${SUPABASE_PROJECT_ID}.supabase.co/functions/v1/paypal-subscription-create"
          status=$(curl --silent --show-error \
            --output /tmp/paypal-subscription-auth.json \
            --write-out "%{http_code}" \
            --request POST "$endpoint" \
            --header "Content-Type: application/json" \
            --data '{}')

          cat /tmp/paypal-subscription-auth.json
          if [[ "$status" != "401" ]]; then
            echo "Expected HTTP 401 from the unauthenticated subscription request; received $status." >&2
            exit 1
          fi

      - name: Verify Stripe compatibility endpoint is non-fatal
        shell: bash
        run: |
          set -euo pipefail

          anon_key=$(sed -n 's/^VITE_SUPABASE_PUBLISHABLE_KEY="\(.*\)"$/\1/p' .env)
          endpoint="https://${SUPABASE_PROJECT_ID}.supabase.co/functions/v1/check-stripe-connect"
          status=$(curl --silent --show-error \
            --output /tmp/stripe-compatibility.json \
            --write-out "%{http_code}" \
            --request POST "$endpoint" \
            --header "apikey: $anon_key" \
            --header "Authorization: Bearer $anon_key" \
            --header "Content-Type: application/json" \
            --data '{}')

          cat /tmp/stripe-compatibility.json
          if [[ "$status" != "200" ]]; then
            echo "Expected HTTP 200 from the disabled Stripe compatibility endpoint; received $status." >&2
            exit 1
          fi
          if [[ "$(jq -r '.legacy_provider_disabled // false' /tmp/stripe-compatibility.json)" != "true" ]]; then
            echo "Stripe compatibility endpoint did not report the legacy provider as disabled." >&2
            exit 1
          fi

      - name: Deployment summary
        shell: bash
        run: |
          echo "PayPal webhook and subscription functions are live on ${SUPABASE_PROJECT_ID}."
          echo "Legacy Stripe status checks now return a safe disabled response instead of HTTP 500."
