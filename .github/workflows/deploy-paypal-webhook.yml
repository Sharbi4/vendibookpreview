name: Deploy PayPal payments

on:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/paypal-webhook/**"
      - "supabase/functions/paypal-subscription-create/**"
      - "supabase/functions/_shared/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-paypal-webhook.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-paypal-payments-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Configure and deploy PayPal functions
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: nbrehbwfsmedbelzntqs
      PAYPAL_WEBHOOK_ID: ${{ secrets.PAYPAL_WEBHOOK_ID }}

    steps:
      - name: Check required GitHub secrets
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${SUPABASE_ACCESS_TOKEN:-}" ]]; then
            echo "Missing GitHub Actions secret: SUPABASE_ACCESS_TOKEN" >&2
            exit 1
          fi
          if [[ -z "${PAYPAL_WEBHOOK_ID:-}" ]]; then
            echo "Missing GitHub Actions secret: PAYPAL_WEBHOOK_ID" >&2
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Install Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: latest

      - name: Set PayPal webhook ID in Supabase
        shell: bash
        run: |
          set -euo pipefail
          supabase secrets set \
            --project-ref "$SUPABASE_PROJECT_ID" \
            PAYPAL_WEBHOOK_ID="$PAYPAL_WEBHOOK_ID"

      - name: Deploy PayPal webhook Edge Function
        shell: bash
        run: |
          set -euo pipefail
          supabase functions deploy paypal-webhook \
            --project-ref "$SUPABASE_PROJECT_ID"

      - name: Deploy PayPal subscription Edge Function
        shell: bash
        run: |
          set -euo pipefail
          supabase functions deploy paypal-subscription-create \
            --project-ref "$SUPABASE_PROJECT_ID"

      - name: Verify public webhook endpoint is reachable
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://${SUPABASE_PROJECT_ID}.supabase.co/functions/v1/paypal-webhook"
          status=$(curl --silent --show-error \
            --output /tmp/paypal-webhook-response.txt \
            --write-out "%{http_code}" \
            --request POST "$endpoint" \
            --header "Content-Type: application/json" \
            --data '{}')

          cat /tmp/paypal-webhook-response.txt

          # A malformed unsigned payload should be rejected by the function,
          # but it must reach the function without Supabase JWT enforcement.
          if [[ "$status" != "400" ]]; then
            echo "Expected HTTP 400 from the malformed-payload reachability test; received $status." >&2
            exit 1
          fi

      - name: Verify subscription endpoint is deployed
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://${SUPABASE_PROJECT_ID}.supabase.co/functions/v1/paypal-subscription-create"
          status=$(curl --silent --show-error \
            --output /tmp/paypal-subscription-response.txt \
            --write-out "%{http_code}" \
            --request POST "$endpoint" \
            --header "Content-Type: application/json" \
            --data '{}')

          cat /tmp/paypal-subscription-response.txt

          # No bearer token should be rejected by application auth. A 401 proves
          # the newly deployed function loaded and executed instead of crashing.
          if [[ "$status" != "401" ]]; then
            echo "Expected HTTP 401 from the unauthenticated subscription smoke test; received $status." >&2
            exit 1
          fi
