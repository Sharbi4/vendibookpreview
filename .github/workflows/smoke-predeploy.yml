name: Pre-Deploy Smoke Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # Fails on push:main when the DB smoke secrets are not configured, so the
  # deploy pipeline cannot ship green while every downstream job silently
  # SKIPs. PRs from forks (which can't access secrets) get a soft warning.
  secrets-configured:
    name: Smoke Secrets Configured (blocks main deploy when missing)
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Verify SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY are set
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            MSG="Missing SUPABASE_URL and/or SUPABASE_SERVICE_ROLE_KEY. All DB smoke tests will SKIP silently. Add them under repo Settings → Secrets and variables → Actions."
            echo "::warning title=Smoke gate INERT::$MSG"
            if [ "$EVENT" = "push" ]; then
              echo "::error title=Deploy gate blocked::$MSG"
              exit 1
            else
              echo "PR from fork or secrets not shared — soft-warning only."
            fi
          else
            echo "✅ Smoke secrets configured."
          fi


  boost-publish-smoke:
    name: Boost-Publish Smoke (blocks deploy on fail)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Run boost-publish smoke (Stephanie scenario)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: bun scripts/smoke/boost-publish-smoke.ts

  delete-listing-smoke:
    name: Delete-Listing Integrity Audit (blocks deploy on fail)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Run delete-listing integrity audit (Chawnee scenario)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: bun scripts/smoke/delete-listing-smoke.ts

  publish-flow-smoke:
    name: Publish-Flow E2E (blocks deploy on fail)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Run publish-flow smoke (list → published, no duplicate rows)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: bun scripts/smoke/publish-flow-smoke.ts

  listing-detail-smoke:
    name: Listing-Detail E2E (blocks deploy on fail)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium
      - name: Build app
        run: bun run build
      - name: Preview server
        run: bunx vite preview --port 8080 --host 127.0.0.1 &
      - name: Wait for preview
        run: |
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8080 >/dev/null && exit 0
            sleep 1
          done
          echo "preview never came up" && exit 1
      - name: Run listing-detail smoke (real IDs render expected fields)
        env:
          APP_BASE_URL: http://127.0.0.1:8080
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: bun scripts/smoke/listing-detail-smoke.ts

  wizard-auth-guard-smoke:
    name: Wizard Auth Guard E2E (blocks deploy on fail)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium
      - name: Build app
        run: bun run build
      - name: Preview server
        run: bunx vite preview --port 8080 --host 127.0.0.1 &
      - name: Wait for preview
        run: |
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8080 >/dev/null && exit 0
            sleep 1
          done
          echo "preview never came up" && exit 1
      - name: Run wizard-auth-guard smoke (unauth + token guard)
        env:
          APP_BASE_URL: http://127.0.0.1:8080
        run: bun scripts/smoke/wizard-auth-guard-smoke.ts

  plural-listing-redirect-smoke:
    name: Plural Listing Alias Redirect E2E (blocks deploy on fail)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium
      - name: Build app
        run: bun run build
      - name: Preview server
        run: bunx vite preview --port 8080 --host 127.0.0.1 &
      - name: Wait for preview
        run: |
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8080 >/dev/null && exit 0
            sleep 1
          done
          echo "preview never came up" && exit 1
      - name: Run plural-listing-redirect smoke (/listings/:id → /listing/:id)
        env:
          APP_BASE_URL: http://127.0.0.1:8080
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: bun scripts/smoke/plural-listing-redirect-smoke.ts

  booking-request-flow-smoke:
    name: Booking-Request Flow E2E (blocks deploy on fail)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Run booking-request-flow smoke (pending → approved / declined)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: bun scripts/smoke/booking-request-flow-smoke.ts

  subscription-lifecycle-smoke:
    name: Subscription Lifecycle Smoke (Stripe TEST mode, blocks deploy on fail)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Run subscription-lifecycle smoke (signed test-mode webhook fixtures)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          STRIPE_MONETIZATION_WEBHOOK_SECRET: ${{ secrets.STRIPE_MONETIZATION_WEBHOOK_SECRET_TEST }}
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          SMOKE_SUPABASE_STORAGE_KEY: ${{ secrets.SMOKE_SUPABASE_STORAGE_KEY }}
          SMOKE_SUPABASE_SESSION_JSON: ${{ secrets.SMOKE_SUPABASE_SESSION_JSON }}
        run: bun scripts/smoke/subscription-lifecycle-smoke.ts

  entitlement-checkout-smoke:
    name: Entitlement Checkout Smoke (Stripe TEST mode, blocks deploy on fail)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Run entitlement-checkout smoke (purchase, short-circuit, webhook)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          STRIPE_MONETIZATION_WEBHOOK_SECRET: ${{ secrets.STRIPE_MONETIZATION_WEBHOOK_SECRET_TEST }}
        run: bun scripts/smoke/entitlement-checkout-smoke.ts

  entitlement-gate-smoke:
    name: Entitlement Gate Smoke (free user → 403 entitlement_required on every gated fn)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Run entitlement-gate smoke (every monetize server action denies free user)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: bun scripts/smoke/entitlement-gate-smoke.ts

  support-ticket-smoke:
    name: Support Ticket Surface Smoke (RLS + Tawk webhook signature/dedupe)
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Run support-ticket smoke (submit + priority + RLS + tawk sig + dedupe + bad-sig)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          TAWK_WEBHOOK_SECRET: ${{ secrets.TAWK_WEBHOOK_SECRET }}
        run: bun scripts/smoke/support-ticket-smoke.ts










  readonly-prod-smoke:
    name: Read-Only Production Smoke (no writes, no side effects)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium
      - name: Build app
        run: bun run build
      - name: Preview server
        run: bunx vite preview --port 8080 --host 127.0.0.1 &
      - name: Wait for preview
        run: |
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8080 >/dev/null && exit 0
            sleep 1
          done
          echo "preview never came up" && exit 1
      - name: Run read-only smoke (routes, CTAs, links; no signup/tx/ticket)
        env:
          APP_BASE_URL: http://127.0.0.1:8080
        run: bun scripts/smoke/readonly-prod-smoke.ts

  listing-detail-visual-smoke:
    name: Listing-Detail Visual (360 / 390 / 1440)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium
      - name: Build app
        run: bun run build
      - name: Preview server
        run: bunx vite preview --port 8080 --host 127.0.0.1 &
      - name: Wait for preview
        run: |
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8080 >/dev/null && exit 0
            sleep 1
          done
          echo "preview never came up" && exit 1
      - name: Run listing-detail visual smoke
        env:
          APP_BASE_URL: http://127.0.0.1:8080
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: bun scripts/smoke/listing-detail-visual-smoke.ts
      - name: Upload viewport screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: listing-detail-viewports
          path: /tmp/listing-detail-visual/*.png
          if-no-files-found: warn






