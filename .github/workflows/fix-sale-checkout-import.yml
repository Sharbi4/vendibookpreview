name: Fix Sale Checkout Import

on:
  push:
    branches:
      - enhance/search-location-ux
    paths:
      - scripts/fix-sale-checkout-import.mjs
      - .github/workflows/fix-sale-checkout-import.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: enhance/search-location-ux
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/fix-sale-checkout-import.mjs
      - run: |
          rm scripts/fix-sale-checkout-import.mjs
          rm .github/workflows/fix-sale-checkout-import.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/SaleCheckout.tsx scripts/fix-sale-checkout-import.mjs .github/workflows/fix-sale-checkout-import.yml
          git commit -m "Fix malformed SaleCheckout import"
          git push origin HEAD:enhance/search-location-ux
