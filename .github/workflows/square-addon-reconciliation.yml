name: Payment and offer regression checks

on:
  push:
    branches: [fix/paypal-webhook-config]
    paths:
      - 'supabase/functions/**'
      - 'src/**'
      - 'drizzle/migrations/**'
      - 'supabase/migrations/**'
      - 'scripts/**'
      - 'scripts/test-square-addon-reconciliation.mjs'
      - '.github/workflows/square-addon-reconciliation.yml'
  pull_request:
    paths:
      - 'supabase/functions/**'
      - 'src/**'
      - 'drizzle/migrations/**'
      - 'supabase/migrations/**'
      - 'scripts/**'
      - 'scripts/test-square-addon-reconciliation.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconciliation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconciliation behavioral tests
        run: node scripts/test-square-addon-reconciliation.mjs
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Offer deadline behavior
        run: node --experimental-strip-types scripts/test-offer-state.mjs
      - name: Equipment fee and consent regressions
        run: bunx vitest run src/test/payments/equipmentSaleFee.test.ts src/lib/fees/feeConfig.test.ts src/test/purchaseRequestPolicy.test.tsx src/test/payments/paypalSellerStatus.test.ts src/test/payments/paypalInvoiceReadiness.test.ts src/test/payments/paypalOnboardingError.test.ts src/lib/vendi-listing/__tests__/script.test.ts
      - name: Isolated invoice database
        run: |
          npm install --prefix "$RUNNER_TEMP/invoice-test" @electric-sql/pglite@0.3.14
          PGLITE_MODULE="$RUNNER_TEMP/invoice-test/node_modules/@electric-sql/pglite/dist/index.js" node scripts/test-invoice-commerce.mjs
      - name: Build UI without data-generation side effects
        run: bunx vite build
